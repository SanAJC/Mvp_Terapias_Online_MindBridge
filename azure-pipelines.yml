trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/**
      - .gitignore
      - .git/**
      - .github/**
      - .vscode/**

variables:
  - group: mvp-secrets
  - name: IMAGE_TAG
    value: $(Build.BuildId)

stages:
  # STAGE 1: Build & Push Docker Images
  - stage: Build
    displayName: "Build & Push Docker Images"
    jobs:
      - job: BuildImages
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: "Login al ACR"
            inputs:
              command: login
              containerRegistry: acr-service-connection

          - task: Docker@2
            displayName: "Build y Push Backend"
            inputs:
              command: buildAndPush
              repository: backend
              dockerfile: Backend/Dockerfile
              buildContext: Backend
              containerRegistry: acr-service-connection
              tags: |
                $(IMAGE_TAG)
                latest

          - task: Docker@2
            displayName: "Build Frontend"
            inputs:
              command: build
              repository: frontend
              dockerfile: Frontend/Dockerfile
              buildContext: Frontend
              containerRegistry: acr-service-connection
              arguments: '--build-arg VITE_BACKEND_URL=$(VITE_BACKEND_URL)'
              tags: |
                $(IMAGE_TAG)
                latest

          - task: Docker@2
            displayName: "Push Frontend"
            inputs:
              command: push
              repository: frontend
              containerRegistry: acr-service-connection
              tags: |
                $(IMAGE_TAG)
                latest

  # STAGE 2: Migraciones de base de datos
  - stage: Migrate
    displayName: "Run Database Migrations"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: RunMigrations
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: "Instalar Node.js"

          - script: |
              cd Backend
              npm install
            displayName: "Instalar dependencias"

          - script: |
              cd Backend
              npx prisma migrate deploy
            displayName: "Aplicar migraciones de Prisma"
            env:
              DATABASE_URL: $(DATABASE_URL)
  # STAGE 3: Deploy a Azure Container Apps
  - stage: Deploy
    displayName: "Deploy to Azure Container Apps"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployProduction
        displayName: "Deploy a produccion"
        environment: production
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: "Deploy Backend"
                  inputs:
                    azureSubscription: azure-service-connection
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp update \
                        --name backend-app \
                        --resource-group rg-mvp-prod \
                        --image acrmvp2024.azurecr.io/backend:$(IMAGE_TAG) \
                        --set-env-vars \
                          DATABASE_URL="$(DATABASE_URL)" \
                          JWT_SECRET="$(JWT_SECRET)" \
                          NODE_ENV="production" \
                          PORT="3000" \
                          FRONTEND_URL="$(FRONTEND_URL)"

                - task: AzureCLI@2
                  displayName: "Deploy Frontend"
                  inputs:
                    azureSubscription: azure-service-connection
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp update \
                        --name frontend-app \
                        --resource-group rg-mvp-prod \
                        --image acrmvp2024.azurecr.io/frontend:$(IMAGE_TAG)
